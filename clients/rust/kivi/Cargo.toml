[package]
# published as `kivi-sdk` (crates.io `kivi` is taken); imported as `kivi` in code
# via the [lib] name below, so users write `use kivi::…`.
name = "kivi-sdk"
version = "1.1.0"
edition = "2021"
description = "The untrusting client SDK for the kivi event-ledger database"
license = "MIT"
homepage = "https://iwasoft.com"
repository = "https://github.com/iwasoftcom/kivi"
documentation = "https://docs.rs/kivi-sdk"
readme = "README.md"
keywords = ["kivi", "ledger", "event-sourcing", "grpc", "audit"]
categories = ["database", "api-bindings"]
# ship only what the crate needs to build standalone (no examples/tests/target)
include = ["src/**/*", "build.rs", "proto/**/*", "README.md", "LICENSE"]

[lib]
name = "kivi"  # importable as `use kivi::…` even though the crate is `kivi-sdk`

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = "0.1"
futures-core = "0.3"
async-stream = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
hex = "0.4"

[build-dependencies]
tonic-build = "0.12"
